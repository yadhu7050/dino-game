<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dino Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #e0e0e0;
      font-weight: normal;
    }

    .game {
      width: 800px;
      height: 250px;
      border: 2px solid #444;
      margin: 0 auto 30px;
      position: relative;
      background: #2a2a2a;
      overflow: hidden;
      border-radius: 4px;
    }

    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: #555;
    }

    #dino {
      width: 50px;
      height: 50px;
      position: absolute;
      bottom: 2px;
      left: 80px;
      font-size: 50px;
      z-index: 2;
      transform: scaleX(-1);
    }

    #cactus {
      width: 30px;
      height: 50px;
      position: absolute;
      bottom: 2px;
      right: -30px;
      font-size: 50px;
      animation: cactusMove 2s infinite linear;
      z-index: 1;
    }

    @keyframes cactusMove {
      0% { right: -30px; }
      100% { right: 100%; }
    }

    .jump {
      animation: jump 0.5s ease-out;
    }

    @keyframes jump {
      0% { bottom: 2px; }
      50% { bottom: 130px; }
      100% { bottom: 2px; }
    }

    .game-over {
      animation-play-state: paused !important;
    }

    #score {
      font-size: 24px;
      color: #e0e0e0;
      margin-bottom: 10px;
    }

    #highScore {
      font-size: 18px;
      color: #999;
      margin-bottom: 20px;
    }

    .instructions {
      font-size: 14px;
      color: #777;
      margin-top: 10px;
    }

    .game-over-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      color: #e0e0e0;
      z-index: 10;
      display: none;
      font-weight: bold;
    }

    .game-over-text.show {
      display: block;
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: #444;
      border-radius: 50%;
      opacity: 0.3;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🦖 DINO RUN 🦖</h1>
    
    <div id="score">Score: 0</div>
    <div id="highScore">High Score: 0</div>
    
    <div class="game">
      <div class="stars" id="stars"></div>
      <div class="ground"></div>
      <div id="dino">🦖</div>
      <div id="cactus">🌵</div>
      <div class="game-over-text" id="gameOverText">GAME OVER!</div>
    </div>
    
    <div class="instructions">
      Press <strong>SPACE</strong> or <strong>↑</strong> to jump | Press <strong>ENTER</strong> to restart
    </div>
  </div>

  <script>
    const dino = document.getElementById("dino");
    const cactus = document.getElementById("cactus");
    const scoreDisplay = document.getElementById("score");
    const highScoreDisplay = document.getElementById("highScore");
    const gameOverText = document.getElementById("gameOverText");
    const starsContainer = document.getElementById("stars");

    let isJumping = false;
    let score = 0;
    let highScore = 0;
    let isGameOver = false;
    let gameSpeed = 2;

    // Create stars
    for (let i = 0; i < 30; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 3 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 70 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      starsContainer.appendChild(star);
    }

    highScoreDisplay.innerText = `High Score: ${highScore}`;

    document.addEventListener("keydown", function (event) {
      if ((event.code === "Space" || event.key === "ArrowUp") && !isJumping && !isGameOver) {
        event.preventDefault();
        jump();
      } else if (event.code === "Enter" && isGameOver) {
        event.preventDefault();
        restartGame();
      }
    });

    document.addEventListener("touchstart", function(event) {
      if (!isJumping && !isGameOver) {
        jump();
      } else if (isGameOver) {
        restartGame();
      }
    });

    function jump() {
      isJumping = true;
      dino.classList.add("jump");
      setTimeout(() => {
        dino.classList.remove("jump");
        isJumping = false;
      }, 500);
    }

    function endGame() {
      if (isGameOver) return;
      
      isGameOver = true;
      cactus.classList.add("game-over");
      gameOverText.classList.add("show");
      
      if (score > highScore) {
        highScore = score;
        highScoreDisplay.innerText = `High Score: ${highScore} 🎉`;
      }
    }

    function restartGame() {
      isGameOver = false;
      score = 0;
      gameSpeed = 2;
      gameOverText.classList.remove("show");
      cactus.classList.remove("game-over");
      cactus.style.animation = 'none';
      setTimeout(() => {
        cactus.style.animation = `cactusMove ${gameSpeed}s infinite linear`;
      }, 10);
      scoreDisplay.innerText = "Score: 0";
    }

    function checkCollision() {
      if (isGameOver) return;

      const dinoRect = dino.getBoundingClientRect();
      const cactusRect = cactus.getBoundingClientRect();

      const collision = !(
        dinoRect.right < cactusRect.left + 10 ||
        dinoRect.left > cactusRect.right - 10 ||
        dinoRect.bottom < cactusRect.top + 10 ||
        dinoRect.top > cactusRect.bottom
      );

      if (collision) {
        endGame();
      }
    }

    function updateScore() {
      if (!isGameOver) {
        score++;
        scoreDisplay.innerText = "Score: " + score;
        
        if (score % 100 === 0 && gameSpeed > 1) {
          gameSpeed -= 0.1;
          cactus.style.animation = `cactusMove ${gameSpeed}s infinite linear`;
        }
      }
    }

    setInterval(checkCollision, 10);
    setInterval(updateScore, 100);
  </script>
</body>
</html>
